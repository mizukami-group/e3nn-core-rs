[workspace]
members = ["crates/e3nn-core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mizukami-group/e3nn-core-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
indexing_slicing = "allow"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = "0.5"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
